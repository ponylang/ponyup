name: Update vendored LibreSSL

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'LibreSSL version (e.g., 4.2.1)'
        required: true
        default: '4.2.1'
      branch:
        description: 'Push to this branch (leave empty to create a new branch and PR)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  build-darwin-arm64:
    name: Build LibreSSL for darwin-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build LibreSSL
        run: bash .ci-scripts/build-macos-libressl.bash
        env:
          LIBRESSL_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: libressl-darwin-arm64
          path: lib/darwin-arm64/*.a

  build-darwin-x86-64:
    name: Build LibreSSL for darwin-x86-64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build LibreSSL
        run: bash .ci-scripts/build-macos-libressl.bash
        env:
          LIBRESSL_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: libressl-darwin-x86-64
          path: lib/darwin-x86-64/*.a

  download-windows-x86-64:
    name: Download LibreSSL for windows-x86-64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download LibreSSL
        run: .ci-scripts\windows-install-libressl.ps1
        env:
          LIBRESSL_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: libressl-windows-x86-64
          path: lib/windows-x86-64/*.lib

  download-windows-arm64:
    name: Download LibreSSL for windows-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download LibreSSL
        run: .ci-scripts\windows-install-libressl.ps1
        env:
          LIBRESSL_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: libressl-windows-arm64
          path: lib/windows-arm64/*.lib

  vendor:
    name: Commit vendored libraries
    needs: [build-darwin-arm64, build-darwin-x86-64, download-windows-x86-64, download-windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: libressl-darwin-arm64
          path: lib/darwin-arm64/
      - uses: actions/download-artifact@v8.0.1
        with:
          name: libressl-darwin-x86-64
          path: lib/darwin-x86-64/
      - uses: actions/download-artifact@v8.0.1
        with:
          name: libressl-windows-x86-64
          path: lib/windows-x86-64/
      - uses: actions/download-artifact@v8.0.1
        with:
          name: libressl-windows-arm64
          path: lib/windows-arm64/
      - name: Commit and push
        run: |
          git config user.name "Ponylang Main Bot"
          git config user.email "ponylang.main@gmail.com"

          if [ -n "${{ inputs.branch }}" ]; then
            # Switch to existing branch or create it from current HEAD
            BRANCH="${{ inputs.branch }}"
            git fetch origin "${BRANCH}" 2>/dev/null \
              && git checkout "${BRANCH}" \
              || git checkout -b "${BRANCH}"
            git add lib/
            git commit -m "Vendor LibreSSL ${{ inputs.version }} static libraries"
            git push -u origin "${BRANCH}"
          else
            # Create a new branch and open a PR
            BRANCH="update-libressl-${{ inputs.version }}"
            git checkout -b "${BRANCH}"
            git add lib/
            git commit -m "Vendor LibreSSL ${{ inputs.version }} static libraries"
            git push -u origin "${BRANCH}"
            gh pr create \
              --title "Update vendored LibreSSL to ${{ inputs.version }}" \
              --body "$(cat <<'EOF'
          Updates the vendored LibreSSL static libraries to version ${{ inputs.version }}.

          macOS libraries built on CI runners. Windows libraries downloaded from GitHub releases.
          EOF
            )"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
